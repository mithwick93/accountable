server {
    listen 80;
    server_name accountable.mithwick.com;

    # Redirect HTTP → HTTPS
    return 301 https://$host:3443$request_uri;
}

server {
    listen 3443 ssl;
    http2 on;

    server_name accountable.mithwick.com;

    ssl_certificate /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;

    root /usr/share/nginx/html;
    index index.html;

    # ✅ Service Worker (CRITICAL - must not fall back to index.html)
    location = /sw.js {
        try_files $uri =404;
        add_header Cache-Control "no-cache";
    }

    # ✅ Workbox files generated by Vite PWA
    location ~* ^/workbox-.*\.js$ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # ✅ Static assets (avoid SPA fallback)
    location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|json)$ {
        try_files $uri =404;
    }

    # ✅ SPA fallback (KEEP THIS LAST)
    location / {
        try_files $uri /index.html;
    }

    # Security headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-XSS-Protection "1; mode=block" always;
}